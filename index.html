<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>G-Pixel Eternal Lite · VS 0.1</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar" id="topbar">
      <div class="title">G-Pixel Lite</div>
      <div class="res" id="res-line"></div>
    </header>

    <div id="main-views" style="flex:1;overflow:hidden;display:flex;flex-direction:column">
      <div id="view-sortie" class="view"></div>
      <div id="view-party" class="view hidden"></div>
      <div id="view-roster" class="view hidden"></div>
      <div id="view-gacha" class="view hidden"></div>
      <div id="view-shop" class="view hidden"></div>
    </div>

    <div id="combat-view" class="view hidden">
      <div class="combat-hud" id="combat-hud"></div>
      <div class="board-wrap"><div id="board"></div></div>
      <div class="combat-controls" id="combat-controls"></div>
      <div class="combat-log" id="combat-log"></div>
    </div>

    <nav class="tabbar">
      <button data-tab="sortie" class="active"><span class="ico">⚔</span>出击</button>
      <button data-tab="party"><span class="ico">👥</span>编队</button>
      <button data-tab="roster"><span class="ico">🤖</span>机体</button>
      <button data-tab="gacha"><span class="ico">🎲</span>抽卡</button>
      <button data-tab="shop"><span class="ico">🏪</span>商店</button>
    </nav>
  </div>

  <script src="js/data/units.js"></script>
  <script src="js/data/stages.js"></script>
  <script src="js/data/gacha.js"></script>
  <script src="js/state.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
